name: Build Sotigram v0.4.0 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble source archive
        run: |
          cat build-v030/part*.b64 | tr -d '\n' | base64 --decode > /tmp/Sotigram-source.zip
          unzip -t /tmp/Sotigram-source.zip
          unzip -q /tmp/Sotigram-source.zip -d source
      - name: Apply v0.4.0 UI update
        run: python build-v030/apply-v040.py source/Sotigram-Android
      - name: Build debug APK
        working-directory: source/Sotigram-Android
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sotigram-v0.4.0-apk
          path: source/Sotigram-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
