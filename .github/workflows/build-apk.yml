name: Build Sotigram APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q Sotigram-Android-Full-Source.zip -d source
          find source -name settings.gradle.kts -print -quit | grep -q .

      - name: Inspect app source for auth and owner flow
        working-directory: source/Sotigram-Android
        run: |
          echo '===== MainActivity.kt ====='
          sed -n '1,260p' app/src/main/java/com/sotigram/app/MainActivity.kt
          echo '===== SupabaseApi.kt ====='
          sed -n '1,320p' app/src/main/java/com/sotigram/app/SupabaseApi.kt
          echo '===== Migration ====='
          sed -n '1,360p' supabase/migrations/20261124085000_messaging_and_owner_hardening.sql
          echo '===== README ====='
          sed -n '1,240p' README.md

      - name: Build debug APK
        working-directory: source/Sotigram-Android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sotigram-debug-apk
          path: source/Sotigram-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
