name: Sotigram Next Android APK
on:
  push:
    branches: [sotigram-next-v1]
    paths: ["Sotigram-Next/**", ".github/workflows/sotigram-next-build.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: Sotigram-Next
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sotigram-Next-debug-apk
          path: Sotigram-Next/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
